<!DOCTYPE html>
<html>
<head>
    <title>Pong - Hunter's Arcade</title>

    <style>
        body {
            background-color: #111827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        canvas {
            background-color: black;
            border: 3px solid #2563eb;
        }

        button {
            background-color: #2563eb;
            color: white;
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #3b82f6;
        }

        #gameOver {
            display: none;
            color: #ef4444;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Pong</h1>

    <h2>
        You: <span id="playerScore">0</span>
        |
        Computer: <span id="computerScore">0</span>
    </h2>

    <p>Use the ↑ and ↓ arrow keys to move.</p>

    <canvas id="game" width="700" height="400"></canvas>

    <div id="gameOver">
        <p id="winnerText"></p>
        <button onclick="restartGame()">Play Again</button>
    </div>

    <br>

    <button onclick="window.location.href='index.html'">
        Back to Arcade
    </button>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        const paddleWidth = 12;
        const paddleHeight = 90;

        let playerY = 155;
        let computerY = 155;

        let ballX = 350;
        let ballY = 200;

        let ballSpeedX = 5;
        let ballSpeedY = 3;

        let playerScore = 0;
        let computerScore = 0;

        let upPressed = false;
        let downPressed = false;

        let gameRunning = true;

        document.addEventListener("keydown", function(event) {

            if (event.key === "ArrowUp") {
                upPressed = true;
                event.preventDefault();
            }

            if (event.key === "ArrowDown") {
                downPressed = true;
                event.preventDefault();
            }
        });

        document.addEventListener("keyup", function(event) {

            if (event.key === "ArrowUp") {
                upPressed = false;
            }

            if (event.key === "ArrowDown") {
                downPressed = false;
            }
        });

        function movePlayer() {

            if (upPressed) {
                playerY -= 7;
            }

            if (downPressed) {
                playerY += 7;
            }

            if (playerY < 0) {
                playerY = 0;
            }

            if (playerY + paddleHeight > canvas.height) {
                playerY = canvas.height - paddleHeight;
            }
        }

        function moveComputer() {

            const computerCenter = computerY + paddleHeight / 2;

            if (computerCenter < ballY - 10) {
                computerY += 4;
            }

            if (computerCenter > ballY + 10) {
                computerY -= 4;
            }

            if (computerY < 0) {
                computerY = 0;
            }

            if (computerY + paddleHeight > canvas.height) {
                computerY = canvas.height - paddleHeight;
            }
        }

        function moveBall() {

            ballX += ballSpeedX;
            ballY += ballSpeedY;

            // Bounce from top and bottom
            if (ballY <= 0 || ballY >= canvas.height) {
                ballSpeedY *= -1;
            }

            // Player paddle collision
            if (
                ballX <= 32 &&
                ballX >= 20 &&
                ballY >= playerY &&
                ballY <= playerY + paddleHeight &&
                ballSpeedX < 0
            ) {
                ballSpeedX *= -1;
            }

            // Computer paddle collision
            if (
                ballX >= canvas.width - 32 &&
                ballX <= canvas.width - 20 &&
                ballY >= computerY &&
                ballY <= computerY + paddleHeight &&
                ballSpeedX > 0
            ) {
                ballSpeedX *= -1;
            }

            // Computer scores
            if (ballX < 0) {

                computerScore++;

                document.getElementById("computerScore").textContent =
                    computerScore;

                checkWinner();

                resetBall();
            }

            // Player scores
            if (ballX > canvas.width) {

                playerScore++;

                document.getElementById("playerScore").textContent =
                    playerScore;

                checkWinner();

                resetBall();
            }
        }

        function resetBall() {

            ballX = canvas.width / 2;
            ballY = canvas.height / 2;

            ballSpeedX *= -1;

            ballSpeedY =
                Math.random() > 0.5 ? 3 : -3;
        }

        function checkWinner() {

            if (playerScore >= 5) {
                endGame("YOU WIN!");
            }

            if (computerScore >= 5) {
                endGame("COMPUTER WINS!");
            }
        }

        function endGame(message) {

            gameRunning = false;

            document.getElementById("winnerText").textContent = message;

            document.getElementById("gameOver").style.display = "block";
        }

        function restartGame() {

            playerScore = 0;
            computerScore = 0;

            document.getElementById("playerScore").textContent = 0;
            document.getElementById("computerScore").textContent = 0;

            playerY = 155;
            computerY = 155;

            ballX = canvas.width / 2;
            ballY = canvas.height / 2;

            ballSpeedX = 5;
            ballSpeedY = 3;

            document.getElementById("gameOver").style.display = "none";

            gameRunning = true;
        }

        function draw() {

            // Background
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Center line
            ctx.strokeStyle = "#374151";
            ctx.setLineDash([10, 10]);

            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();

            ctx.setLineDash([]);

            // Player paddle
            ctx.fillStyle = "#22c55e";
            ctx.fillRect(
                20,
                playerY,
                paddleWidth,
                paddleHeight
            );

            // Computer paddle
            ctx.fillStyle = "#ef4444";
            ctx.fillRect(
                canvas.width - 32,
                computerY,
                paddleWidth,
                paddleHeight
            );

            // Ball
            ctx.fillStyle = "white";

            ctx.beginPath();
            ctx.arc(ballX, ballY, 8, 0, Math.PI * 2);
            ctx.fill();
        }

        function gameLoop() {

            if (gameRunning) {
                movePlayer();
                moveComputer();
                moveBall();
            }

            draw();

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>

</body>
</html>
