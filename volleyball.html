<!DOCTYPE html>
<html>
<head>
    <title>2-Player Volleyball</title>

    <style>
        body {
            margin: 0;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: #60a5fa;
            text-shadow: 0 0 15px #2563eb;
            margin-bottom: 5px;
        }

        #score {
            font-size: 26px;
            font-weight: bold;
            margin: 10px;
        }

        .blue {
            color: #38bdf8;
        }

        .red {
            color: #f87171;
        }

        canvas {
            background: #7dd3fc;
            border: 4px solid #2563eb;
            border-radius: 12px;
            max-width: 95%;
            box-shadow: 0 0 25px #2563eb66;
        }

        #message {
            min-height: 42px;
            font-size: 32px;
            font-weight: bold;
            margin: 8px;
            color: #facc15;
        }

        button {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            border: none;
            border-radius: 9px;
            padding: 12px 20px;
            margin: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <h1>2-PLAYER VOLLEYBALL</h1>

    <div id="score">
        <span class="blue">
            Player 1: <span id="p1Score">0</span>
        </span>

        &nbsp;&nbsp; VS &nbsp;&nbsp;

        <span class="red">
            Player 2: <span id="p2Score">0</span>
        </span>
    </div>

    <p>
        Player 1: A / D + W to jump
        &nbsp; | &nbsp;
        Player 2: ← / → + ↑ to jump
    </p>

    <p>First to 10 points wins!</p>

    <canvas id="game" width="850" height="500"></canvas>

    <div id="message"></div>

    <button onclick="restartGame()">
        Restart
    </button>

    <button onclick="window.location.href='index.html'">
        Back to Arcade
    </button>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const GRAVITY = 0.6;
const GROUND = 440;
const NET_X = canvas.width / 2;

let keys = {};

let score1 = 0;
let score2 = 0;

let gameRunning = true;
let countdownActive = false;
let countdownTimer = null;


/* PLAYER 1 */

const player1 = {

    x: 150,
    y: 380,

    w: 50,
    h: 60,

    vx: 0,
    vy: 0,

    speed: 3.5,

    jumping: false,

    color: "#3b82f6"

};


/* PLAYER 2 */

const player2 = {

    x: 650,
    y: 380,

    w: 50,
    h: 60,

    vx: 0,
    vy: 0,

    speed: 3.5,

    jumping: false,

    color: "#ef4444"

};


/* BALL */

const ball = {

    x: 230,
    y: 120,

    radius: 18,

    vx: 0,
    vy: 0

};


/* KEYBOARD */

document.addEventListener("keydown", function(event) {

    keys[event.key.toLowerCase()] = true;


    if (
        event.key === "ArrowLeft" ||
        event.key === "ArrowRight" ||
        event.key === "ArrowUp"
    ) {

        event.preventDefault();

    }


    /* PLAYER 1 JUMP */

    if (
        event.key.toLowerCase() === "w" &&
        !player1.jumping &&
        gameRunning
    ) {

        player1.vy = -12;
        player1.jumping = true;

    }


    /* PLAYER 2 JUMP */

    if (
        event.key === "ArrowUp" &&
        !player2.jumping &&
        gameRunning
    ) {

        player2.vy = -12;
        player2.jumping = true;

    }

});


document.addEventListener("keyup", function(event) {

    keys[event.key.toLowerCase()] = false;

});


/* PLAYER MOVEMENT */

function updatePlayers() {

    player1.vx = 0;
    player2.vx = 0;


    /* PLAYER 1 */

    if (keys["a"]) {
        player1.vx = -player1.speed;
    }

    if (keys["d"]) {
        player1.vx = player1.speed;
    }


    /* PLAYER 2 */

    if (keys["arrowleft"]) {
        player2.vx = -player2.speed;
    }

    if (keys["arrowright"]) {
        player2.vx = player2.speed;
    }


    player1.x += player1.vx;
    player2.x += player2.vx;


    /* KEEP PLAYER 1 ON LEFT */

    if (player1.x < 0) {
        player1.x = 0;
    }

    if (
        player1.x + player1.w >
        NET_X - 10
    ) {

        player1.x =
            NET_X -
            10 -
            player1.w;

    }


    /* KEEP PLAYER 2 ON RIGHT */

    if (
        player2.x <
        NET_X + 10
    ) {

        player2.x =
            NET_X + 10;

    }

    if (
        player2.x + player2.w >
        canvas.width
    ) {

        player2.x =
            canvas.width -
            player2.w;

    }


    updatePlayerGravity(player1);
    updatePlayerGravity(player2);

}


/* PLAYER GRAVITY */

function updatePlayerGravity(player) {

    player.vy += GRAVITY;

    player.y += player.vy;


    if (
        player.y + player.h >=
        GROUND
    ) {

        player.y =
            GROUND -
            player.h;

        player.vy = 0;

        player.jumping = false;

    }

}


/* BALL MOVEMENT */

function updateBall() {

    ball.vy += GRAVITY * 0.6;

    ball.x += ball.vx;
    ball.y += ball.vy;


    /* LEFT WALL */

    if (
        ball.x -
        ball.radius < 0
    ) {

        ball.x = ball.radius;
        ball.vx = Math.abs(ball.vx);

    }


    /* RIGHT WALL */

    if (
        ball.x +
        ball.radius >
        canvas.width
    ) {

        ball.x =
            canvas.width -
            ball.radius;

        ball.vx =
            -Math.abs(ball.vx);

    }


    /* CEILING */

    if (
        ball.y -
        ball.radius < 0
    ) {

        ball.y = ball.radius;
        ball.vy = Math.abs(ball.vy);

    }


    hitPlayer(player1);
    hitPlayer(player2);

    hitNet();


    /* BALL TOUCHES GROUND */

    if (
        ball.y +
        ball.radius >=
        GROUND
    ) {

        if (ball.x < NET_X) {

            scorePoint(2);

        }

        else {

            scorePoint(1);

        }

    }

}


/* BALL HITS PLAYER */

function hitPlayer(player) {

    const centerX =
        player.x +
        player.w / 2;

    const centerY =
        player.y +
        player.h / 2;


    const dx =
        ball.x -
        centerX;

    const dy =
        ball.y -
        centerY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const playerRadius = 35;

    const minimum =
        ball.radius +
        playerRadius;


    if (distance < minimum) {

        const safe =
            Math.max(
                distance,
                0.01
            );


        const nx = dx / safe;
        const ny = dy / safe;


        /*
        Slower hit speeds.
        Jumping still gives a stronger spike.
        */

        const power =
            player.jumping
            ? 7
            : 5.5;


        ball.x =
            centerX +
            nx * minimum;

        ball.y =
            centerY +
            ny * minimum;


        ball.vx =
            nx * power +
            player.vx * 0.5;


        ball.vy =
            ny * power +
            player.vy * 0.35;


        if (
            Math.abs(ball.vy) <
            2.5
        ) {

            ball.vy = -4;

        }

    }

}


/* NET COLLISION */

function hitNet() {

    const netWidth = 12;
    const netHeight = 150;

    const netTop =
        GROUND -
        netHeight;


    if (
        ball.y + ball.radius >
        netTop &&

        ball.x + ball.radius >
        NET_X -
        netWidth / 2 &&

        ball.x - ball.radius <
        NET_X +
        netWidth / 2
    ) {

        /* TOP OF NET */

        if (
            ball.y <
            netTop + 12
        ) {

            ball.y =
                netTop -
                ball.radius;

            ball.vy =
                -Math.abs(
                    ball.vy
                );

        }

        /* SIDE OF NET */

        else {

            if (ball.x < NET_X) {

                ball.x =
                    NET_X -
                    netWidth / 2 -
                    ball.radius;

                ball.vx =
                    -Math.abs(
                        ball.vx
                    );

            }

            else {

                ball.x =
                    NET_X +
                    netWidth / 2 +
                    ball.radius;

                ball.vx =
                    Math.abs(
                        ball.vx
                    );

            }

        }

    }

}


/* POINT SCORED */

function scorePoint(player) {

    if (
        !gameRunning ||
        countdownActive
    ) {
        return;
    }


    if (player === 1) {

        score1++;

    }

    else {

        score2++;

    }


    updateScore();


    if (score1 >= 10) {

        endGame(
            "PLAYER 1 WINS!"
        );

        return;

    }


    if (score2 >= 10) {

        endGame(
            "PLAYER 2 WINS!"
        );

        return;

    }


    /*
    Player who scored receives
    the next serve.
    */

    prepareServe(player);

}


/* PREPARE SERVE */

function prepareServe(server) {

    countdownActive = true;


    /*
    Ball waits above the
    serving player's side.
    */

    ball.x =
        server === 1
        ? 230
        : 620;

    ball.y = 120;

    ball.vx = 0;
    ball.vy = 0;


    /*
    Players reset, but they
    CAN move during countdown.
    */

    player1.x = 150;
    player1.y = 380;

    player1.vx = 0;
    player1.vy = 0;

    player1.jumping = false;


    player2.x = 650;
    player2.y = 380;

    player2.vx = 0;
    player2.vy = 0;

    player2.jumping = false;


    startCountdown(server);

}


/* COUNTDOWN */

function startCountdown(server) {

    if (countdownTimer) {

        clearInterval(
            countdownTimer
        );

    }


    let number = 3;


    document
        .getElementById("message")
        .textContent =
        number;


    countdownTimer =
        setInterval(
            function() {

                number--;


                if (number > 0) {

                    document
                        .getElementById("message")
                        .textContent =
                        number;

                }

                else {

                    clearInterval(
                        countdownTimer
                    );

                    countdownTimer = null;


                    document
                        .getElementById("message")
                        .textContent =
                        "GO!";


                    countdownActive =
                        false;


                    /*
                    Slow serve.
                    */

                    ball.vx =
                        server === 1
                        ? 2
                        : -2;

                    ball.vy = 0;


                    setTimeout(
                        function() {

                            if (
                                gameRunning &&
                                !countdownActive
                            ) {

                                document
                                    .getElementById("message")
                                    .textContent =
                                    "";

                            }

                        },
                        600
                    );

                }

            },
            1000
        );

}


/* SCORE DISPLAY */

function updateScore() {

    document
        .getElementById("p1Score")
        .textContent =
        score1;


    document
        .getElementById("p2Score")
        .textContent =
        score2;

}


/* END GAME */

function endGame(message) {

    gameRunning = false;

    countdownActive = false;


    if (countdownTimer) {

        clearInterval(
            countdownTimer
        );

        countdownTimer = null;

    }


    ball.vx = 0;
    ball.vy = 0;


    document
        .getElementById("message")
        .textContent =
        message;

}


/* DRAW COURT */

function drawCourt() {

    const sky =
        ctx.createLinearGradient(
            0,
            0,
            0,
            GROUND
        );


    sky.addColorStop(
        0,
        "#38bdf8"
    );


    sky.addColorStop(
        1,
        "#bae6fd"
    );


    ctx.fillStyle = sky;


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* SUN */

    ctx.fillStyle =
        "#facc15";


    ctx.beginPath();


    ctx.arc(
        80,
        70,
        35,
        0,
        Math.PI * 2
    );


    ctx.fill();


    /* SAND */

    ctx.fillStyle =
        "#d6a75c";


    ctx.fillRect(
        0,
        GROUND,
        canvas.width,
        canvas.height -
        GROUND
    );


    /* CENTER LINE */

    ctx.strokeStyle =
        "white";


    ctx.lineWidth = 4;


    ctx.beginPath();


    ctx.moveTo(
        NET_X,
        GROUND
    );


    ctx.lineTo(
        NET_X,
        canvas.height
    );


    ctx.stroke();


    /* NET */

    const netTop =
        GROUND - 150;


    ctx.strokeStyle =
        "#334155";


    ctx.lineWidth = 8;


    ctx.beginPath();


    ctx.moveTo(
        NET_X,
        netTop
    );


    ctx.lineTo(
        NET_X,
        GROUND
    );


    ctx.stroke();


    /* NET HORIZONTAL LINES */

    ctx.strokeStyle =
        "#e2e8f0";


    ctx.lineWidth = 2;


    for (
        let y = netTop;
        y < GROUND;
        y += 15
    ) {

        ctx.beginPath();


        ctx.moveTo(
            NET_X - 20,
            y
        );


        ctx.lineTo(
            NET_X + 20,
            y
        );


        ctx.stroke();

    }

}


/* DRAW PLAYER */

function drawPlayer(player) {

    const cx =
        player.x +
        player.w / 2;

    const cy =
        player.y +
        player.h / 2;


    /* BODY */

    ctx.fillStyle =
        player.color;


    ctx.beginPath();


    ctx.arc(
        cx,
        cy,
        30,
        0,
        Math.PI * 2
    );


    ctx.fill();


    /* EYES */

    ctx.fillStyle =
        "white";


    ctx.beginPath();


    ctx.arc(
        cx - 9,
        cy - 8,
        6,
        0,
        Math.PI * 2
    );


    ctx.arc(
        cx + 9,
        cy - 8,
        6,
        0,
        Math.PI * 2
    );


    ctx.fill();


    ctx.fillStyle =
        "#111827";


    ctx.beginPath();


    ctx.arc(
        cx - 9,
        cy - 8,
        2,
        0,
        Math.PI * 2
    );


    ctx.arc(
        cx + 9,
        cy - 8,
        2,
        0,
        Math.PI * 2
    );


    ctx.fill();

}


/* DRAW BALL */

function drawBall() {

    ctx.fillStyle =
        "white";


    ctx.beginPath();


    ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI * 2
    );


    ctx.fill();


    ctx.strokeStyle =
        "#2563eb";


    ctx.lineWidth = 4;


    ctx.beginPath();


    ctx.arc(
        ball.x,
        ball.y,
        ball.radius - 5,
        -0.5,
        1.5
    );


    ctx.stroke();


    ctx.strokeStyle =
        "#facc15";


    ctx.beginPath();


    ctx.arc(
        ball.x,
        ball.y,
        ball.radius - 5,
        1.5,
        3.5
    );


    ctx.stroke();

}


/* DRAW */

function draw() {

    drawCourt();

    drawPlayer(player1);

    drawPlayer(player2);

    drawBall();

}


/* RESTART */

function restartGame() {

    score1 = 0;
    score2 = 0;

    gameRunning = true;


    if (countdownTimer) {

        clearInterval(
            countdownTimer
        );

        countdownTimer = null;

    }


    document
        .getElementById("message")
        .textContent = "";


    updateScore();


    prepareServe(1);

}


/* GAME LOOP */

function gameLoop() {

    if (gameRunning) {

        /*
        Players always move,
        including during countdown.
        */

        updatePlayers();


        /*
        Ball stays frozen until
        countdown finishes.
        */

        if (!countdownActive) {

            updateBall();

        }

    }


    draw();


    requestAnimationFrame(
        gameLoop
    );

}


/* START */

updateScore();

prepareServe(1);

gameLoop();

</script>

</body>
</html>
