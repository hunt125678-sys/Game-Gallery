<!DOCTYPE html>
<html>
<head>
    <title>Breakout - Hunter's Arcade</title>

    <style>
        body {
            background-color: #111827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        canvas {
            background-color: black;
            border: 3px solid #2563eb;
        }

        button {
            background-color: #2563eb;
            color: white;
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #3b82f6;
        }

        #message {
            font-size: 26px;
            font-weight: bold;
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>Breakout</h1>

    <h2>
        Score: <span id="score">0</span>
    </h2>

    <p>Use the ← and → arrow keys to move.</p>

    <canvas id="game" width="600" height="450"></canvas>

    <div id="message"></div>

    <button id="restartButton"
            onclick="restartGame()"
            style="display:none;">
        Play Again
    </button>

    <br>

    <button onclick="window.location.href='index.html'">
        Back to Arcade
    </button>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        // Paddle
        const paddleWidth = 100;
        const paddleHeight = 12;

        let paddleX =
            (canvas.width - paddleWidth) / 2;

        const paddleY =
            canvas.height - 30;

        let leftPressed = false;
        let rightPressed = false;

        // Ball
        const ballRadius = 8;

        let ballX;
        let ballY;
        let ballSpeedX;
        let ballSpeedY;

        // Score
        let score = 0;
        let gameRunning = true;

        // Bricks
        const rows = 5;
        const columns = 8;

        const brickWidth = 60;
        const brickHeight = 20;

        const brickPadding = 10;
        const brickOffsetTop = 50;
        const brickOffsetLeft = 25;

        let bricks = [];

        function createBricks() {

            bricks = [];

            for (let row = 0; row < rows; row++) {

                for (let column = 0; column < columns; column++) {

                    bricks.push({
                        x:
                            brickOffsetLeft +
                            column *
                            (brickWidth + brickPadding),

                        y:
                            brickOffsetTop +
                            row *
                            (brickHeight + brickPadding),

                        alive: true,

                        color:
                            `hsl(${row * 55}, 80%, 55%)`
                    });
                }
            }
        }

        document.addEventListener("keydown", function(event) {

            if (event.key === "ArrowLeft") {
                leftPressed = true;
                event.preventDefault();
            }

            if (event.key === "ArrowRight") {
                rightPressed = true;
                event.preventDefault();
            }
        });

        document.addEventListener("keyup", function(event) {

            if (event.key === "ArrowLeft") {
                leftPressed = false;
            }

            if (event.key === "ArrowRight") {
                rightPressed = false;
            }
        });

        function movePaddle() {

            if (leftPressed) {
                paddleX -= 7;
            }

            if (rightPressed) {
                paddleX += 7;
            }

            if (paddleX < 0) {
                paddleX = 0;
            }

            if (paddleX + paddleWidth > canvas.width) {
                paddleX =
                    canvas.width - paddleWidth;
            }
        }

        function moveBall() {

            ballX += ballSpeedX;
            ballY += ballSpeedY;

            // Left and right walls
            if (
                ballX - ballRadius <= 0 ||
                ballX + ballRadius >= canvas.width
            ) {
                ballSpeedX *= -1;
            }

            // Top wall
            if (ballY - ballRadius <= 0) {
                ballSpeedY *= -1;
            }

            // Paddle collision
            if (
                ballY + ballRadius >= paddleY &&
                ballY - ballRadius <= paddleY + paddleHeight &&
                ballX >= paddleX &&
                ballX <= paddleX + paddleWidth &&
                ballSpeedY > 0
            ) {
                ballSpeedY *= -1;

                // Changes angle depending on
                // where the ball hits the paddle
                const hit =
                    ballX -
                    (paddleX + paddleWidth / 2);

                ballSpeedX = hit * 0.08;
            }

            checkBrickCollision();

            // Ball falls below screen
            if (ballY - ballRadius > canvas.height) {
                endGame(false);
            }
        }

        function checkBrickCollision() {

            for (let brick of bricks) {

                if (!brick.alive) {
                    continue;
                }

                if (
                    ballX + ballRadius > brick.x &&
                    ballX - ballRadius < brick.x + brickWidth &&
                    ballY + ballRadius > brick.y &&
                    ballY - ballRadius < brick.y + brickHeight
                ) {

                    brick.alive = false;

                    ballSpeedY *= -1;

                    score++;

                    document.getElementById("score")
                        .textContent = score;

                    if (score === rows * columns) {
                        endGame(true);
                    }

                    break;
                }
            }
        }

        function draw() {

            ctx.fillStyle = "black";
            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            // Draw bricks
            for (let brick of bricks) {

                if (!brick.alive) {
                    continue;
                }

                ctx.fillStyle = brick.color;

                ctx.fillRect(
                    brick.x,
                    brick.y,
                    brickWidth,
                    brickHeight
                );
            }

            // Draw paddle
            ctx.fillStyle = "#22c55e";

            ctx.fillRect(
                paddleX,
                paddleY,
                paddleWidth,
                paddleHeight
            );

            // Draw ball
            ctx.fillStyle = "white";

            ctx.beginPath();

            ctx.arc(
                ballX,
                ballY,
                ballRadius,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        function endGame(won) {

            gameRunning = false;

            const message =
                document.getElementById("message");

            if (won) {
                message.textContent = "YOU WIN!";
                message.style.color = "#22c55e";
            } else {
                message.textContent = "GAME OVER";
                message.style.color = "#ef4444";
            }

            document.getElementById("restartButton")
                .style.display = "inline-block";
        }

        function restartGame() {

            score = 0;

            document.getElementById("score")
                .textContent = score;

            document.getElementById("message")
                .textContent = "";

            document.getElementById("restartButton")
                .style.display = "none";

            paddleX =
                (canvas.width - paddleWidth) / 2;

            ballX = canvas.width / 2;
            ballY = canvas.height - 60;

            ballSpeedX = 3;
            ballSpeedY = -4;

            createBricks();

            gameRunning = true;
        }

        function gameLoop() {

            if (gameRunning) {
                movePaddle();
                moveBall();
            }

            draw();

            requestAnimationFrame(gameLoop);
        }

        restartGame();
        gameLoop();
    </script>

</body>
</html>
