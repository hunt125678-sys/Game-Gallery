<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>2-Player Co-op Platformer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background:
                radial-gradient(
                    circle at top,
                    #1e40af,
                    #0f172a 55%,
                    #020617
                );
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            min-height: 100vh;
        }

        h1 {
            margin: 18px 0 5px;
            color: #93c5fd;
            text-shadow:
                0 0 10px #2563eb,
                0 0 25px #2563eb;
        }

        #stats {
            margin: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .blue {
            color: #38bdf8;
        }

        .red {
            color: #fb7185;
        }

        #instructions {
            margin: 8px auto 12px;
            color: #cbd5e1;
        }

        canvas {
            display: block;
            margin: auto;
            max-width: 96%;
            background: #7dd3fc;
            border: 4px solid #3b82f6;
            border-radius: 14px;
            box-shadow:
                0 0 20px #2563eb88,
                0 15px 40px #00000088;
        }

        #message {
            min-height: 40px;
            margin: 10px;
            color: #facc15;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 10px #000;
        }

        button {
            margin: 8px;
            padding: 12px 20px;
            border: none;
            border-radius: 9px;
            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #3b82f6;
        }
    </style>
</head>

<body>

    <h1>2-PLAYER CO-OP PLATFORMER</h1>

    <div id="stats">
        Level:
        <span id="level">1</span>

        &nbsp; | &nbsp;

        Coins:
        <span id="coins">0</span>

        &nbsp; | &nbsp;

        Lives:
        <span id="lives">5</span>
    </div>

    <div id="instructions">
        <span class="blue">
            Player 1: A / D + W
        </span>

        &nbsp; | &nbsp;

        <span class="red">
            Player 2: ← / → + ↑
        </span>

        &nbsp; | &nbsp;

        Both players have double jump!
    </div>

    <canvas
        id="game"
        width="900"
        height="500"
    ></canvas>

    <div id="message"></div>

    <button onclick="restartLevel()">
        Restart Level
    </button>

    <button onclick="restartGame()">
        Restart Game
    </button>

    <button onclick="window.location.href='index.html'">
        Back to Arcade
    </button>

<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;

const GRAVITY = 0.65;

let keys = {};

let currentLevel = 1;
let lives = 5;
let totalCoins = 0;

let gameRunning = true;
let transitionActive = false;

let platforms = [];
let movingPlatforms = [];
let spikes = [];
let coins = [];
let switches = [];
let doors = [];
let checkpoints = [];
let particles = [];

let exit = {
    x: 820,
    y: 370,
    w: 55,
    h: 90
};


/* =========================
   PLAYERS
========================= */

function makePlayer(
    x,
    y,
    color,
    darkColor,
    controls
) {

    return {
        x: x,
        y: y,

        w: 32,
        h: 44,

        vx: 0,
        vy: 0,

        speed: 4.5,
        jumpPower: 12,

        jumps: 0,
        grounded: false,

        color: color,
        darkColor: darkColor,

        controls: controls,

        spawnX: x,
        spawnY: y,

        atExit: false,
        invincible: false
    };

}


const player1 = makePlayer(
    45,
    390,
    "#38bdf8",
    "#0369a1",
    {
        left: "a",
        right: "d",
        jump: "w"
    }
);


const player2 = makePlayer(
    90,
    390,
    "#fb7185",
    "#be123c",
    {
        left: "arrowleft",
        right: "arrowright",
        jump: "arrowup"
    }
);


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key.toLowerCase();

        keys[key] = true;


        if (
            event.key === "ArrowLeft" ||
            event.key === "ArrowRight" ||
            event.key === "ArrowUp"
        ) {

            event.preventDefault();

        }


        if (event.repeat) {
            return;
        }


        tryJump(player1, key);
        tryJump(player2, key);

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        keys[
            event.key.toLowerCase()
        ] = false;

    }
);


/* =========================
   LEVEL CREATION
========================= */

function platform(x, y, w, h = 20) {

    return {
        x: x,
        y: y,
        w: w,
        h: h
    };

}


function coin(x, y) {

    return {
        x: x,
        y: y,
        radius: 10,
        collected: false
    };

}


function spike(x, y, w) {

    return {
        x: x,
        y: y,
        w: w,
        h: 20
    };

}


function switchPad(
    x,
    y,
    color,
    doorId
) {

    return {
        x: x,
        y: y,
        w: 45,
        h: 10,
        color: color,
        doorId: doorId,
        active: false
    };

}


function door(
    id,
    x,
    y,
    w,
    h,
    color
) {

    return {
        id: id,
        x: x,
        y: y,
        w: w,
        h: h,
        color: color,
        open: false
    };

}


function movingPlatform(
    x,
    y,
    w,
    minX,
    maxX,
    speed
) {

    return {
        x: x,
        y: y,
        w: w,
        h: 18,

        minX: minX,
        maxX: maxX,

        speed: speed,
        lastX: x
    };

}


function checkpoint(
    x,
    y
) {

    return {
        x: x,
        y: y,
        w: 20,
        h: 55,
        active: false
    };

}


/* =========================
   LOAD LEVEL
========================= */

function loadLevel(number) {

    gameRunning = true;
    transitionActive = false;

    platforms = [];
    movingPlatforms = [];
    spikes = [];
    coins = [];
    switches = [];
    doors = [];
    checkpoints = [];
    particles = [];


    document
        .getElementById("message")
        .textContent = "";


    if (number === 1) {

        createLevelOne();

    }

    else if (number === 2) {

        createLevelTwo();

    }

    else {

        createLevelThree();

    }


    resetPlayerSpawns();

    updateUI();

}


/* =========================
   LEVEL 1
========================= */

function createLevelOne() {

    platforms = [

        platform(0, 460, 250, 40),

        platform(300, 410, 130),
        platform(480, 350, 120),
        platform(650, 290, 120),
        platform(790, 230, 110),

        platform(620, 460, 280, 40)

    ];


    movingPlatforms = [

        movingPlatform(
            220,
            360,
            90,
            210,
            330,
            1.5
        )

    ];


    spikes = [

        spike(250, 440, 70),
        spike(600, 440, 70)

    ];


    coins = [

        coin(250, 320),
        coin(360, 370),
        coin(535, 310),
        coin(705, 250),
        coin(840, 190)

    ];


    switches = [

        switchPad(
            515,
            340,
            "#38bdf8",
            "blueDoor"
        )

    ];


    doors = [

        door(
            "blueDoor",
            770,
            140,
            25,
            90,
            "#38bdf8"
        )

    ];


    checkpoints = [

        checkpoint(
            660,
            235
        )

    ];


    exit = {
        x: 825,
        y: 370,
        w: 55,
        h: 90
    };

}


/* =========================
   LEVEL 2
========================= */

function createLevelTwo() {

    platforms = [

        platform(0, 460, 170, 40),

        platform(215, 390, 115),
        platform(390, 320, 120),
        platform(565, 250, 120),
        platform(735, 180, 165),

        platform(735, 460, 165, 40)

    ];


    movingPlatforms = [

        movingPlatform(
            120,
            315,
            90,
            100,
            240,
            1.7
        ),

        movingPlatform(
            485,
            200,
            90,
            450,
            620,
            2
        )

    ];


    spikes = [

        spike(170, 440, 65),
        spike(330, 440, 80),
        spike(510, 440, 80),
        spike(665, 440, 70)

    ];


    coins = [

        coin(165, 275),
        coin(270, 350),
        coin(450, 280),
        coin(530, 160),
        coin(625, 210),
        coin(800, 140)

    ];


    switches = [

        switchPad(
            245,
            380,
            "#fb7185",
            "redDoor"
        ),

        switchPad(
            600,
            240,
            "#38bdf8",
            "blueDoor"
        )

    ];


    doors = [

        door(
            "redDoor",
            365,
            230,
            25,
            90,
            "#fb7185"
        ),

        door(
            "blueDoor",
            710,
            90,
            25,
            90,
            "#38bdf8"
        )

    ];


    checkpoints = [

        checkpoint(
            570,
            195
        )

    ];


    exit = {
        x: 820,
        y: 90,
        w: 55,
        h: 90
    };

}


/* =========================
   LEVEL 3
========================= */

function createLevelThree() {

    platforms = [

        platform(0, 460, 125, 40),

        platform(165, 400, 100),
        platform(330, 340, 105),
        platform(500, 280, 105),
        platform(670, 215, 105),
        platform(800, 145, 100),

        platform(790, 460, 110, 40)

    ];


    movingPlatforms = [

        movingPlatform(
            90,
            300,
            90,
            80,
            220,
            2
        ),

        movingPlatform(
            420,
            205,
            90,
            390,
            560,
            2.2
        ),

        movingPlatform(
            650,
            115,
            85,
            620,
            760,
            2.4
        )

    ];


    spikes = [

        spike(125, 440, 60),
        spike(265, 440, 65),
        spike(435, 440, 65),
        spike(605, 440, 65),
        spike(775, 440, 35)

    ];


    coins = [

        coin(140, 260),
        coin(215, 360),
        coin(380, 300),
        coin(465, 165),
        coin(555, 240),
        coin(695, 75),
        coin(720, 175),
        coin(850, 105)

    ];


    switches = [

        switchPad(
            190,
            390,
            "#38bdf8",
            "blueDoor"
        ),

        switchPad(
            525,
            270,
            "#fb7185",
            "redDoor"
        )

    ];


    doors = [

        door(
            "blueDoor",
            305,
            250,
            25,
            90,
            "#38bdf8"
        ),

        door(
            "redDoor",
            775,
            55,
            25,
            90,
            "#fb7185"
        )

    ];


    checkpoints = [

        checkpoint(
            505,
            225
        )

    ];


    exit = {
        x: 825,
        y: 55,
        w: 55,
        h: 90
    };

}


/* =========================
   PLAYER JUMP
========================= */

function tryJump(
    player,
    key
) {

    if (
        key === player.controls.jump &&
        player.jumps < 2 &&
        gameRunning
    ) {

        player.vy =
            -player.jumpPower;

        player.jumps++;

        createParticles(
            player.x +
            player.w / 2,
            player.y +
            player.h,
            "#ffffff",
            6
        );

    }

}


/* =========================
   PLAYER MOVEMENT
========================= */

function updatePlayer(player) {

    player.vx = 0;


    if (
        keys[
            player.controls.left
        ]
    ) {

        player.vx =
            -player.speed;

    }


    if (
        keys[
            player.controls.right
        ]
    ) {

        player.vx =
            player.speed;

    }


    movePlayerHorizontally(player);


    player.vy += GRAVITY;

    player.y += player.vy;

    player.grounded = false;


    landOnPlatforms(player);

    landOnMovingPlatforms(player);

    collideWithDoors(player);


    if (
        player.y >
        HEIGHT + 80
    ) {

        hurtPlayers();

    }


    checkSpikes(player);

    checkCoins(player);

    checkSwitches(player);

    checkCheckpoints(player);

    checkExit(player);

}


/* =========================
   HORIZONTAL COLLISION
========================= */

function movePlayerHorizontally(player) {

    player.x += player.vx;


    if (player.x < 0) {
        player.x = 0;
    }


    if (
        player.x +
        player.w >
        WIDTH
    ) {

        player.x =
            WIDTH -
            player.w;

    }


    for (const p of platforms) {

        if (
            rectanglesTouch(
                player,
                p
            )
        ) {

            if (player.vx > 0) {

                player.x =
                    p.x -
                    player.w;

            }

            else if (
                player.vx < 0
            ) {

                player.x =
                    p.x +
                    p.w;

            }

        }

    }

}


/* =========================
   PLATFORM LANDING
========================= */

function landOnPlatforms(player) {

    for (const p of platforms) {

        const previousBottom =
            player.y +
            player.h -
            player.vy;


        const currentBottom =
            player.y +
            player.h;


        if (
            player.vy >= 0 &&

            player.x +
            player.w >
            p.x &&

            player.x <
            p.x +
            p.w &&

            previousBottom <=
            p.y + 8 &&

            currentBottom >=
            p.y
        ) {

            player.y =
                p.y -
                player.h;

            player.vy = 0;

            player.grounded = true;
            player.jumps = 0;

        }

    }

}


/* =========================
   MOVING PLATFORMS
========================= */

function updateMovingPlatforms() {

    for (
        const p of
        movingPlatforms
    ) {

        p.lastX = p.x;

        p.x += p.speed;


        if (
            p.x <= p.minX ||
            p.x >= p.maxX
        ) {

            p.speed *= -1;

        }

    }

}


function landOnMovingPlatforms(player) {

    for (
        const p of
        movingPlatforms
    ) {

        const previousBottom =
            player.y +
            player.h -
            player.vy;


        const currentBottom =
            player.y +
            player.h;


        if (
            player.vy >= 0 &&

            player.x +
            player.w >
            p.x &&

            player.x <
            p.x +
            p.w &&

            previousBottom <=
            p.y + 8 &&

            currentBottom >=
            p.y
        ) {

            player.y =
                p.y -
                player.h;

            player.vy = 0;

            player.grounded = true;
            player.jumps = 0;

            player.x +=
                p.x -
                p.lastX;

        }

    }

}


/* =========================
   DOORS
========================= */

function collideWithDoors(player) {

    for (const d of doors) {

        if (
            d.open ||
            !rectanglesTouch(
                player,
                d
            )
        ) {

            continue;

        }


        if (player.vx > 0) {

            player.x =
                d.x -
                player.w;

        }

        else if (
            player.vx < 0
        ) {

            player.x =
                d.x +
                d.w;

        }


        if (player.vy > 0) {

            player.y =
                d.y -
                player.h;

            player.vy = 0;
            player.jumps = 0;

        }

        else if (
            player.vy < 0
        ) {

            player.y =
                d.y +
                d.h;

            player.vy = 0;

        }

    }

}


/* =========================
   SWITCHES
========================= */

function checkSwitches(player) {

    for (const s of switches) {

        if (
            player.x +
            player.w >
            s.x &&

            player.x <
            s.x +
            s.w &&

            player.y +
            player.h >=
            s.y - 3 &&

            player.y +
            player.h <=
            s.y + 15
        ) {

            if (!s.active) {

                createParticles(
                    s.x +
                    s.w / 2,
                    s.y,
                    s.color,
                    15
                );

            }


            s.active = true;


            const matchingDoor =
                doors.find(
                    function(d) {

                        return (
                            d.id ===
                            s.doorId
                        );

                    }
                );


            if (matchingDoor) {

                matchingDoor.open =
                    true;

            }

        }

    }

}


/* =========================
   COINS
========================= */

function checkCoins(player) {

    for (const c of coins) {

        if (c.collected) {
            continue;
        }


        const coinBox = {
            x:
                c.x -
                c.radius,

            y:
                c.y -
                c.radius,

            w:
                c.radius * 2,

            h:
                c.radius * 2
        };


        if (
            rectanglesTouch(
                player,
                coinBox
            )
        ) {

            c.collected = true;

            totalCoins++;

            createParticles(
                c.x,
                c.y,
                "#facc15",
                12
            );

            updateUI();

        }

    }

}


/* =========================
   SPIKES
========================= */

function checkSpikes(player) {

    for (const s of spikes) {

        if (
            rectanglesTouch(
                player,
                s
            )
        ) {

            hurtPlayers();
            return;

        }

    }

}


/* =========================
   CHECKPOINTS
========================= */

function checkCheckpoints(player) {

    for (
        const point of
        checkpoints
    ) {

        if (
            rectanglesTouch(
                player,
                point
            )
        ) {

            if (!point.active) {

                for (
                    const other of
                    checkpoints
                ) {

                    other.active =
                        false;

                }


                point.active = true;


                player1.spawnX =
                    point.x - 40;

                player1.spawnY =
                    point.y - 20;


                player2.spawnX =
                    point.x + 25;

                player2.spawnY =
                    point.y - 20;


                createParticles(
                    point.x,
                    point.y,
                    "#22c55e",
                    20
                );


                showTemporaryMessage(
                    "CHECKPOINT!"
                );

            }

        }

    }

}


/* =========================
   EXIT
========================= */

function checkExit(player) {

    player.atExit =
        rectanglesTouch(
            player,
            exit
        );


    if (
        player1.atExit &&
        player2.atExit &&
        !transitionActive
    ) {

        finishLevel();

    }

}


/* =========================
   DAMAGE
========================= */

let damageLocked = false;


function hurtPlayers() {

    if (
        damageLocked ||
        !gameRunning
    ) {
        return;
    }


    damageLocked = true;

    lives--;

    updateUI();


    createParticles(
        player1.x,
        player1.y,
        "#38bdf8",
        18
    );


    createParticles(
        player2.x,
        player2.y,
        "#fb7185",
        18
    );


    if (lives <= 0) {

        gameRunning = false;

        document
            .getElementById(
                "message"
            )
            .textContent =
            "GAME OVER";

        return;

    }


    respawnPlayers();


    setTimeout(
        function() {

            damageLocked = false;

        },
        700
    );

}


/* =========================
   RESPAWN
========================= */

function respawnPlayers() {

    resetOnePlayer(player1);
    resetOnePlayer(player2);

}


function resetOnePlayer(player) {

    player.x = player.spawnX;
    player.y = player.spawnY;

    player.vx = 0;
    player.vy = 0;

    player.jumps = 0;
    player.atExit = false;

}


/* =========================
   LEVEL FINISH
========================= */

function finishLevel() {

    transitionActive = true;
    gameRunning = false;


    createParticles(
        exit.x +
        exit.w / 2,
        exit.y +
        exit.h / 2,
        "#facc15",
        50
    );


    if (currentLevel < 3) {

        document
            .getElementById(
                "message"
            )
            .textContent =
            "LEVEL COMPLETE!";


        setTimeout(
            function() {

                currentLevel++;

                loadLevel(
                    currentLevel
                );

            },
            1400
        );

    }

    else {

        document
            .getElementById(
                "message"
            )
            .textContent =
            "YOU BEAT THE GAME TOGETHER!";

    }

}


/* =========================
   MOVEMENT HELPERS
========================= */

function rectanglesTouch(a, b) {

    return (

        a.x < b.x + b.w &&

        a.x + a.w > b.x &&

        a.y < b.y + b.h &&

        a.y + a.h > b.y

    );

}


/* =========================
   PARTICLES
========================= */

function createParticles(
    x,
    y,
    color,
    amount
) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        particles.push({

            x: x,
            y: y,

            vx:
                Math.random() *
                6 - 3,

            vy:
                Math.random() *
                -5 - 1,

            size:
                Math.random() *
                5 + 2,

            life: 40,

            color: color

        });

    }

}


function updateParticles() {

    for (
        const particle of
        particles
    ) {

        particle.x +=
            particle.vx;

        particle.y +=
            particle.vy;

        particle.vy += 0.15;

        particle.life--;

    }


    particles =
        particles.filter(
            function(particle) {

                return (
                    particle.life >
                    0
                );

            }
        );

}


/* =========================
   BACKGROUND
========================= */

function drawBackground() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            HEIGHT
        );


    gradient.addColorStop(
        0,
        currentLevel === 3
            ? "#312e81"
            : "#38bdf8"
    );


    gradient.addColorStop(
        1,
        currentLevel === 3
            ? "#111827"
            : "#dbeafe"
    );


    ctx.fillStyle = gradient;


    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    /* Distant mountains */

    ctx.fillStyle =
        currentLevel === 3
        ? "#4338ca"
        : "#64748b";


    ctx.beginPath();

    ctx.moveTo(0, 400);
    ctx.lineTo(160, 190);
    ctx.lineTo(310, 400);
    ctx.lineTo(480, 210);
    ctx.lineTo(660, 400);
    ctx.lineTo(810, 180);
    ctx.lineTo(900, 330);
    ctx.lineTo(900, 500);
    ctx.lineTo(0, 500);

    ctx.fill();

}


/* =========================
   DRAW WORLD
========================= */

function drawPlatforms() {

    for (const p of platforms) {

        ctx.fillStyle =
            "#22c55e";


        ctx.fillRect(
            p.x,
            p.y,
            p.w,
            7
        );


        ctx.fillStyle =
            "#854d0e";


        ctx.fillRect(
            p.x,
            p.y + 7,
            p.w,
            p.h - 7
        );

    }


    for (
        const p of
        movingPlatforms
    ) {

        ctx.fillStyle =
            "#a855f7";


        ctx.fillRect(
            p.x,
            p.y,
            p.w,
            p.h
        );


        ctx.fillStyle =
            "#e9d5ff";


        ctx.fillRect(
            p.x + 8,
            p.y + 5,
            p.w - 16,
            4
        );

    }

}


function drawSpikes() {

    for (const s of spikes) {

        for (
            let x = s.x;
            x < s.x + s.w;
            x += 20
        ) {

            ctx.fillStyle =
                "#ef4444";


            ctx.beginPath();

            ctx.moveTo(
                x,
                s.y + s.h
            );

            ctx.lineTo(
                x + 10,
                s.y
            );

            ctx.lineTo(
                x + 20,
                s.y + s.h
            );

            ctx.fill();

        }

    }

}


function drawCoins() {

    for (const c of coins) {

        if (c.collected) {
            continue;
        }


        ctx.fillStyle =
            "#facc15";


        ctx.beginPath();


        ctx.arc(
            c.x,
            c.y,
            c.radius,
            0,
            Math.PI * 2
        );


        ctx.fill();


        ctx.strokeStyle =
            "#fef08a";


        ctx.lineWidth = 3;

        ctx.stroke();

    }

}


function drawSwitches() {

    for (const s of switches) {

        ctx.fillStyle =
            s.active
            ? "#22c55e"
            : s.color;


        ctx.fillRect(
            s.x,
            s.y,
            s.w,
            s.h
        );


        ctx.fillStyle =
            "#111827";


        ctx.fillRect(
            s.x + 10,
            s.y + s.h,
            s.w - 20,
            7
        );

    }

}


function drawDoors() {

    for (const d of doors) {

        if (d.open) {

            ctx.globalAlpha = 0.2;

        }


        ctx.fillStyle =
            d.color;


        ctx.fillRect(
            d.x,
            d.y,
            d.w,
            d.h
        );


        ctx.globalAlpha = 1;

    }

}


function drawCheckpoints() {

    for (
        const point of
        checkpoints
    ) {

        ctx.fillStyle =
            "#e2e8f0";


        ctx.fillRect(
            point.x,
            point.y,
            5,
            point.h
        );


        ctx.fillStyle =
            point.active
            ? "#22c55e"
            : "#facc15";


        ctx.beginPath();

        ctx.moveTo(
            point.x + 5,
            point.y
        );

        ctx.lineTo(
            point.x + 35,
            point.y + 10
        );

        ctx.lineTo(
            point.x + 5,
            point.y + 20
        );

        ctx.fill();

    }

}


function drawExit() {

    ctx.fillStyle =
        "#facc15";


    ctx.fillRect(
        exit.x,
        exit.y,
        exit.w,
        exit.h
    );


    ctx.fillStyle =
        "#92400e";


    ctx.fillRect(
        exit.x + 8,
        exit.y + 12,
        exit.w - 16,
        exit.h - 12
    );


    ctx.fillStyle =
        "#fde68a";


    ctx.beginPath();


    ctx.arc(
        exit.x +
        exit.w - 13,
        exit.y +
        exit.h / 2,
        4,
        0,
        Math.PI * 2
    );


    ctx.fill();


    ctx.fillStyle =
        "white";


    ctx.font =
        "bold 13px Arial";


    ctx.textAlign =
        "center";


    ctx.fillText(
        "BOTH",
        exit.x +
        exit.w / 2,
        exit.y - 8
    );

}


/* =========================
   DRAW PLAYERS
========================= */

function drawPlayer(player) {

    ctx.fillStyle =
        "#00000044";


    ctx.fillRect(
        player.x + 4,
        player.y + 5,
        player.w,
        player.h
    );


    ctx.fillStyle =
        player.color;


    ctx.fillRect(
        player.x,
        player.y,
        player.w,
        player.h
    );


    ctx.fillStyle =
        player.darkColor;


    ctx.fillRect(
        player.x,
        player.y +
        player.h - 9,
        player.w,
        9
    );


    /* Eyes */

    ctx.fillStyle =
        "white";


    ctx.fillRect(
        player.x + 7,
        player.y + 9,
        6,
        7
    );


    ctx.fillRect(
        player.x + 20,
        player.y + 9,
        6,
        7
    );


    ctx.fillStyle =
        "#111827";


    ctx.fillRect(
        player.x + 10,
        player.y + 11,
        2,
        3
    );


    ctx.fillRect(
        player.x + 23,
        player.y + 11,
        2,
        3
    );

}


/* =========================
   DRAW PARTICLES
========================= */

function drawParticles() {

    for (
        const particle of
        particles
    ) {

        ctx.globalAlpha =
            particle.life / 40;


        ctx.fillStyle =
            particle.color;


        ctx.fillRect(
            particle.x,
            particle.y,
            particle.size,
            particle.size
        );

    }


    ctx.globalAlpha = 1;

}


/* =========================
   DRAW
========================= */

function draw() {

    drawBackground();

    drawPlatforms();

    drawSpikes();

    drawCoins();

    drawSwitches();

    drawDoors();

    drawCheckpoints();

    drawExit();

    drawPlayer(player1);

    drawPlayer(player2);

    drawParticles();

}


/* =========================
   UI
========================= */

function updateUI() {

    document
        .getElementById("level")
        .textContent =
        currentLevel;


    document
        .getElementById("coins")
        .textContent =
        totalCoins;


    document
        .getElementById("lives")
        .textContent =
        lives;

}


function showTemporaryMessage(
    text
) {

    document
        .getElementById("message")
        .textContent =
        text;


    setTimeout(
        function() {

            if (
                gameRunning &&
                !transitionActive
            ) {

                document
                    .getElementById(
                        "message"
                    )
                    .textContent =
                    "";

            }

        },
        900
    );

}


/* =========================
   RESTARTS
========================= */

function resetPlayerSpawns() {

    player1.spawnX = 45;
    player1.spawnY = 390;

    player2.spawnX = 90;
    player2.spawnY = 390;

    respawnPlayers();

}


function restartLevel() {

    loadLevel(currentLevel);

}


function restartGame() {

    currentLevel = 1;
    lives = 5;
    totalCoins = 0;

    damageLocked = false;

    loadLevel(1);

}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    if (gameRunning) {

        updateMovingPlatforms();

        updatePlayer(player1);

        updatePlayer(player2);

    }


    updateParticles();

    draw();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================
   START
========================= */

loadLevel(1);

gameLoop();

</script>
