<!DOCTYPE html>
<html>
<head>
    <title>Chromebook Game Test</title>

    <style>
        body {
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #game {
            width: 600px;
            max-width: 90%;
            height: 350px;
            margin: 20px auto;
            background: #0f172a;
            border: 4px solid #3b82f6;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        #player {
            width: 40px;
            height: 40px;
            background: #22c55e;
            position: absolute;
            left: 50px;
            top: 155px;
            border-radius: 8px;
        }

        #coin {
            width: 30px;
            height: 30px;
            background: #facc15;
            position: absolute;
            right: 50px;
            top: 160px;
            border-radius: 50%;
            box-shadow: 0 0 15px #facc15;
        }

        button {
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 8px;
        }
    </style>
</head>

<body>

    <h1>Chromebook Game Test</h1>

    <h2>Score: <span id="score">0</span></h2>

    <p>Use W A S D or the arrow keys.</p>

    <div id="game">
        <div id="player"></div>
        <div id="coin"></div>
    </div>

    <p id="status">
        Move the green square into the yellow coin.
    </p>

    <button onclick="restartGame()">
        Restart
    </button>

    <button onclick="window.location.href='index.html'">
        Back to Arcade
    </button>

    <script>
        const game = document.getElementById("game");
        const player = document.getElementById("player");
        const coin = document.getElementById("coin");

        let x = 50;
        let y = 155;
        let score = 0;

        const speed = 15;

        document.addEventListener("keydown", function(event) {

            const key = event.key.toLowerCase();

            if (key === "a" || key === "arrowleft") {
                x -= speed;
            }

            if (key === "d" || key === "arrowright") {
                x += speed;
            }

            if (key === "w" || key === "arrowup") {
                y -= speed;
            }

            if (key === "s" || key === "arrowdown") {
                y += speed;
            }

            if (
                key === "arrowleft" ||
                key === "arrowright" ||
                key === "arrowup" ||
                key === "arrowdown"
            ) {
                event.preventDefault();
            }

            keepInsideGame();
            updatePlayer();
            checkCoin();
        });


        function keepInsideGame() {

            const maxX =
                game.clientWidth - player.offsetWidth;

            const maxY =
                game.clientHeight - player.offsetHeight;

            x = Math.max(0, Math.min(x, maxX));
            y = Math.max(0, Math.min(y, maxY));
        }


        function updatePlayer() {

            player.style.left = x + "px";
            player.style.top = y + "px";
        }


        function checkCoin() {

            const playerBox =
                player.getBoundingClientRect();

            const coinBox =
                coin.getBoundingClientRect();

            if (
                playerBox.left < coinBox.right &&
                playerBox.right > coinBox.left &&
                playerBox.top < coinBox.bottom &&
                playerBox.bottom > coinBox.top
            ) {

                score++;

                document.getElementById("score")
                    .textContent = score;

                moveCoin();
            }
        }


        function moveCoin() {

            const maxX =
                game.clientWidth - coin.offsetWidth;

            const maxY =
                game.clientHeight - coin.offsetHeight;

            const newX =
                Math.floor(Math.random() * maxX);

            const newY =
                Math.floor(Math.random() * maxY);

            coin.style.left = newX + "px";
            coin.style.right = "auto";

            coin.style.top = newY + "px";
        }


        function restartGame() {

            x = 50;
            y = 155;
            score = 0;

            document.getElementById("score")
                .textContent = 0;

            updatePlayer();
            moveCoin();
        }

    </script>

</body>
</html>
